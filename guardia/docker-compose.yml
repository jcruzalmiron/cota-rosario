# Desarrollo con Postgres real: web + worker + base. Sin secretos en este archivo.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: guardia
      POSTGRES_USER: guardia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solo-local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardia -d guardia"]
      interval: 5s
      retries: 10

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run migrate && npm run dev -- -H 0.0.0.0"
    environment:
      DATABASE_URL: postgres://guardia:${POSTGRES_PASSWORD:-solo-local}@db:5432/guardia
      AUTH_MODE: dev-local
      QR_SECRET: ${QR_SECRET:-solo-local-compose}
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:3300:3300"
    depends_on:
      db: { condition: service_healthy }

  worker:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run worker"
    environment:
      DATABASE_URL: postgres://guardia:${POSTGRES_PASSWORD:-solo-local}@db:5432/guardia
      QR_SECRET: ${QR_SECRET:-solo-local-compose}
    volumes:
      - .:/app
      - worker_node_modules:/app/node_modules
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  web_node_modules:
  worker_node_modules:
